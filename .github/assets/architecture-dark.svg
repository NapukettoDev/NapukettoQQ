<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="510" viewBox="0 0 1360 510" role="img" aria-labelledby="title desc">
<title id="title">NapukettoQQ 架构总览</title>
<desc id="desc">CLI / supervisor 启动 boot，boot 拉起自建宿主（标准 Node，加载 stub QQNT.dll 与 wrapper.node），wrapper.node 之上是 kernel，kernel 之上是 adapter，adapter 对外提供 Milky、OneBot 11、Satori、KuroBot 四套协议。</desc>
