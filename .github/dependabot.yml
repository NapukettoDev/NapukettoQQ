# Dependabot 配置（2026-11-03 依赖审计整改，显式入库）
#
# 之前仓库没有任何 dependabot.yml：GitHub 上的 Dependabot security updates 由
# 仓库/组织设置托管，只在命中高危公告时被动开 PR，不管理常规补丁漂移，也不可
# 审计。这份配置把「常规更新」纳入 Git：
#   - npm（pnpm workspace）：每周一次，patch/minor 按生产/开发分组，避免一次
#     十几条 PR；major 单独开，便于人工 review 破坏性变更。
#   - github-actions：每周一次，跟随 action 大版本（checkout v7 等）。
#
# @napuketto/* 是 workspace 内部包，版本由 changesets 联动，Dependabot 不应该碰。
# 升级后仍需人工跑 `pnpm install && pnpm check && pnpm test`（本文件不自动改代码）。
version: 2
updates:
    - package-ecosystem: npm
      directory: "/"
      schedule:
          interval: weekly
          day: monday
          time: "09:00"
          timezone: Asia/Shanghai
      open-pull-requests-limit: 5
      groups:
          production-dependencies:
              dependency-type: production
              update-types:
                  - patch
                  - minor
          development-dependencies:
              dependency-type: development
              update-types:
                  - patch
                  - minor
      ignore:
          # workspace 内部包：changesets 联动升版本，Dependabot 改了会打断发布链
          - dependency-name: "@napuketto/*"

    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
          day: monday
          time: "09:00"
          timezone: Asia/Shanghai
      groups:
          github-actions:
              patterns:
                  - "*"
