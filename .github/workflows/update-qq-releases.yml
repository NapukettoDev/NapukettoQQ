name: update-qq-releases

# qq-releases.json 自动维护：每日 cron + 手动触发。
# 脚本 tooling/qq-releases/update-qq-releases.ts 与本地共用（纯 Node 零第三方依赖）：
#   抓取 QQ 官方下载配置（rainbow pcConfig.json，im.qq.com 新版 SPA 的数据源）
#   → 解析最新版号与下载链接 → 下载安装包计算 sha256 → 用内置 7-Zip 解析安装包
#   内部版本目录名（含构建号）→ 更新 qq-releases.json（保留历史、按版本递增）。
# Linux（2026-11-10 起）：同一脚本还会抓官方 linuxConfig.js，按 x64 deb 的 URL 变化
#   更新 platform=linux / arch / coreVersion / sha256（版本取自 deb 内
#   resources/app/package.json）。arm64 暂不自动登记（等真机验证，见
#   packages/loader/docs/design.md §2.5），Linux 侧失败只 warn、不拖累 Windows 更新。
#
# 失败策略（2026-09-20 起）：更新步骤 continue-on-error，失败不刷红 CI——
# 腾讯 CDN 的路径拦截（QQNTV2 路径段 2026-08-25 起被 WAF 按字面量大小写拦截）
# 属外部因素，定时任务红了只会逼人禁用。
# 2026-10-07 已定位并修复：拦截规则区分大小写且不回源，源站大小写不敏感，
# 脚本改为请求小写 `/qqntv2/` 路径段（normalizeDownloadUrl），见 tooling 头注释。
# 失败仍在追踪 issue 上评论报警（按标题去重，issue 不存在则创建），
# 本地跑 tooling/qq-releases/update-qq-releases.ts 兜底更新清单。
#
# 2026-11-11 修正（issue #100）：CDN 边缘曾把 linuxConfig.js 缓存成旧版（3.2.33，
# 源站已是 3.2.35），旧 deb 早已下架 → 下载 404 → 异常冒到 main，整次运行判失败并
# 开追踪 issue（其实 Windows 侧无事可做）。现在 Linux 侧与 Windows 同口径防降级，
# 且单架构下载/解包失败只 warn；因此**本 job 的报警只代表 Windows 侧 / 配置解析 /
# 清单本身真失败**，Linux 附加条目不会再刷出这条 issue。
# 另：脚本由 node 直接执行 TS（无构建），依赖链必须保持「零相对 import」——
# 2026-11-11 的分组重构曾让本地兜底命令 ERR_MODULE_NOT_FOUND，守卫见
# tooling/qq-releases/update-qq-releases.import.test.ts。
#
# 为什么提 PR 用 App token 而不是 github.token（2026-11-04 修复，run 41818514612）：
# 此前用 `github.token` 提 PR，本仓一直提不出来——仓库设置
# 「Allow GitHub Actions to create and approve pull requests」是关的，REST 直接回
# `GitHub Actions is not permitted to create or approve pull requests`。这不是偶发：
# 清单大多天没变化（脚本无 diff），`create-pull-request` 也就跳过建 PR，于是绿灯
# 掩盖了这个必然性故障，直到 QQ 出了新版（11-03 / 11-04 连续红）才暴露。
#
# 而且**打开那个仓库开关也不够**：GITHUB_TOKEN 创建/更新的事不触发任何 workflow
# （GitHub 对 GITHUB_TOKEN 免触发），PR 上的 pull_request 事件不会发生，CI 不跑，
# gate / windows / audit 三个必需检查永远缺报 → PR 进不了 merge queue → 等于不可
# 合并。故改用 NapukettoBot App 的 installation token（与 release.yml 同一 App）：
# App token 创建 PR 会正常触发 CI，机器人 PR 因此能被真正门禁与审查。
#
# 代价与边界：
#   · App 需要 **Pull requests: Read and write**（原本只有 Contents: Read and write；
#     配置步骤与非代码前置见 .github/workflows/release.yml 头注释）。
#   · App 同时具有 ruleset bypass 与 Contents 写权限（release.yml 用它直推 main）。
#     这里的 token 只在更新脚本**跑完之后**才铸造，且用 `repositories: NapukettoQQ`
#     限定到本仓（不含私有 submodule 仓），把持有面压到「只读代码之后的一步」。
#   · 标签不再由 action 打：`labels` 走 Issues API，App 没有 Issues 权限，硬打会
#     在 PR 建好之后报错；维护者认标题前缀 `chore(loader):` 即可。
on:
    schedule:
        # 每天 UTC 03:17（避开整点高峰）
        - cron: "17 3 * * *"
    workflow_dispatch:

# 提 PR 与推分支都走 App token，GITHUB_TOKEN 只剩「读代码 + 追踪 issue」两件事。
# 不再声明 contents / pull-requests 写权限：给了也用不上（GITHUB_TOKEN 建不了 PR），
# 只是多开一道不必要的口子。
permissions:
    contents: read
    issues: write

jobs:
    update:
        runs-on: ubuntu-24.04
        steps:
            # App 配置缺失时早失败：否则要等下载完安装包（约 2 分钟）才在铸 token
            # 处报难懂的错。与 release.yml 同名同源（variable + secret）。
            - name: 检查 App 配置
              env:
                  APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
              run: |
                  if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
                      echo "::error::缺少 NapukettoBot App 配置（variable RELEASE_APP_CLIENT_ID / secret RELEASE_APP_PRIVATE_KEY），无法自动开 PR；见 .github/workflows/release.yml 头注释。"
                      exit 1
                  fi

            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: 更新 qq-releases.json
              id: update
              continue-on-error: true
              run: node tooling/qq-releases/update-qq-releases.ts

            - name: 失败则在追踪 issue 报警（去重，不刷红 CI）
              if: steps.update.outcome == 'failure'
              uses: actions/github-script@v9
              with:
                  script: |
                      const title = "chore(loader): qq-releases 自动更新失败（需本地兜底）";
                      const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                      const body = [
                          `update-qq-releases 于 ${new Date().toISOString()} 更新失败。`,
                          `运行日志: ${runUrl}`,
                          ``,
                          `脚本已对下载 URL 做路径段归一化（\`/QQNTV2/\` → \`/qqntv2/\`），`,
                          `用于绕开 CDN 边缘那条区分大小写的拦截规则（2026-10-07 定位，不回源 403）。`,
                          `若仍失败，请按日志判断阶段：① 配置源 pcConfig.json 改版 → 解析失败；`,
                          `② 拦截规则收紧（如改为大小写不敏感）→ 需重新定位可用路径；`,
                          `③ 安装包结构变化 → 版本目录名解析失败。`,
                          ``,
                          `Linux 侧（附加条目）的旧版配置会被防降级跳过、单架构下载失败只写 warn，`,
                          `不会触发这条告警——到这里说明 Windows 侧或配置解析真的失败了。`,
                          ``,
                          `兜底方式：本地跑 \`node tooling/qq-releases/update-qq-releases.ts\`，`,
                          `把变更后的 packages/loader/qq-releases.json 提交上来。`,
                      ].join("\n");
                      const { data: issues } = await github.rest.issues.listForRepo({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          state: "open",
                          per_page: 100,
                      });
                      const existing = issues.find((i) => i.title === title);
                      if (existing) {
                          await github.rest.issues.createComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: existing.number,
                              body,
                          });
                      } else {
                          await github.rest.issues.create({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              title,
                              body,
                          });
                      }

            # token 在更新脚本之后铸造：脚本（来自 main 的受审代码）跑完才出现凭证，
            # 缩短「可执行代码与被推 main 的凭证同处一 job」的窗口。`repositories`
            # 只列本仓——不列私有 submodule 仓 Napuketto-Native，本 job 也检不出它。
            - if: steps.update.outcome == 'success'
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  repositories: NapukettoQQ

            - if: steps.update.outcome == 'success'
              id: pr
              name: 有变更则提 PR
              uses: peter-evans/create-pull-request@v8
              with:
                  # 用 App token 而非 github.token，理由见文首「为什么提 PR 用 App token」。
                  token: ${{ steps.app-token.outputs.token }}
                  commit-message: "chore(loader): 更新 qq-releases.json 到最新 QQ 版本"
                  branch: chore/qq-releases-update
                  delete-branch: true
                  title: "chore(loader): 自动更新 qq-releases.json"
                  body: |
                      由 update-qq-releases workflow 自动生成。
                      解析 QQ 官方下载配置 + 下载安装包计算 sha256 + 解析版本目录。
                      请核对版本号与 sha256 后合并。
