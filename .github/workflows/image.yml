# 官方镜像构建流水线
#
# 触发：CLI 的发布 tag（release.yml 在 prepare 阶段推 `@napuketto/cli@<版本>`）或手动触发。
# 用 tag 而不是 workflow_run：release.yml 的 publish 需要 environment 审批，workflow_run
# 要等审批完成才拿到 completed 事件；tag 在 prepare 阶段就推送，镜像构建与 npm 发布并行。
#
# 并行的代价：构建总是抢在 npm publish 前面——tag 在 prepare 阶段就推，publish 还要
# 等 environment 审批。故构建前必须先等 registry 就绪，等待方式见下方「预检」步骤：
# 用与 Dockerfile 相同的命令**真实安装一遍**并重试，而不是探测版本端点。
#
# 为什么不是探测端点（2026-11-14 起反复复发的同一类事故的根因）：
# 「cli 的版本端点 200」不等于「镜像装得出来」。npm 需要的是**整个依赖闭包**在该时刻
# 可解析、且每个 tarball 可下载，而 registry 有两段独立的传播时延，都会打穿端点探测：
#   · packument 带 `cache-control: public, max-age=300`：刚发布的依赖版本最多 5 分钟内
#     看不见 → `ETARGET notarget No matching version found for @napuketto/adapter@^0.17.1`
#     （run 44074278605 / 44314473375）。旧护栏还主动加 `?cb=` cachebust，等于让自己
#     永远看不到 npm 会撞上的那份陈旧副本：护栏通过、构建必炸。
#   · tarball 在边缘节点的可见性另有数分钟滞后：packument 已列出该版本，tarball 仍
#     404（run 44630653726 的 media-0.2.0.tgz、44307534863 的 cli-0.6.18.tgz）。
# publish 失败或审批迟迟不来 → 预检最终超时失败，补发后手动 workflow_dispatch 补建。
#
# 只构建 linux/amd64：arm64 的 stub / 清单条目尚未交付（见
# docs/architecture/linux-native-host.md 附录 E.2），不发布未验证的平台。
#
# 镜像内容只由已发布的 npm 包决定（Dockerfile 里 `npm install -g @napuketto/cli@<版本>`），
# 不 COPY 工作树源码——因此 tag 指向的源码被改动也不会把未发布代码带进镜像。
#
# 一次构建产出两个变体（同一 Dockerfile，只差 WITH_FFMPEG）：
#   - 默认：带静态 ffmpeg/ffprobe，语音/视频开箱即用；标签 latest / cli-<版本> / sha-<sha>
#   - slim：不带 ffmpeg（纯文本 Bot）；标签 latest-slim / cli-<版本>-slim / sha-<sha>-slim
# 两个变体在同一个 job 里顺序构建，slim 直接吃 full 刚导出的 GHA 缓存（只重跑最后
# 一个条件层），额外耗时几秒；顺序执行也避免两个 job 并发写同一个缓存 scope。
#
# 首次发布后 GHCR 包默认 private，需要在包设置里手动改为 public（或用带凭据的拉取）。

name: Image

on:
    push:
        tags:
            - "@napuketto/cli@*"
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: image-${{ github.ref }}
    cancel-in-progress: true

jobs:
    image:
        name: build & push (linux/amd64)
        runs-on: ubuntu-24.04
        # 等待上限 5 小时（publish 的 environment 审批没人能保证时长，此前两次
        # 40 分钟上限直接把运行判死：run 44551910700 / 44528438376）+ 两个变体构建
        # （冷缓存约 10 分钟）。超时上限受 GitHub 单 job 6 小时硬顶约束，故留 55 分钟余量。
        timeout-minutes: 360
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 解析版本与镜像名
              id: ver
              run: |
                  if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
                      version="$(jq -r .version apps/cli/package.json)"
                  else
                      version="${GITHUB_REF_NAME##*@}"
                  fi
                  echo "version=${version}" >> "${GITHUB_OUTPUT}"
                  echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/napukettoqq" >> "${GITHUB_OUTPUT}"

            # 与 Dockerfile 里的 node:24 对齐：预检要复现构建期 npm 的解析行为
            # （不同 npm 大版本的 semver 处理有差异，如 11 拒绝隐式 latest 降级）。
            - name: Setup Node（预检用，与镜像内 node:24 对齐）
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24

            # 判据是「装得上」而不是「查得到」：用与 Dockerfile 完全相同的命令装进临时
            # prefix，失败就重试（理由见文件头「为什么不是探测端点」）。成功一次即说明
            # registry 的解析与 tarball 下载都已就绪，紧接着的构建不会再撞竞态。
            #
            # 不设尝试次数上限、只看 deadline：publish 等审批时每 30 秒重试一次即可。
            # 每次失败都清空 prefix，避免半装状态让下一次尝试「看起来成功」。
            - name: 预检 registry（真实安装，直到成功）
              timeout-minutes: 340
              env:
                  NAPUKETTO_VERSION: ${{ steps.ver.outputs.version }}
                  PREFLIGHT_PREFIX: ${{ runner.temp }}/preflight
              run: |
                  set -uo pipefail
                  log="${RUNNER_TEMP}/preflight.log"
                  deadline=$(( $(date +%s) + 300 * 60 ))
                  attempt=0
                  while true; do
                      attempt=$((attempt + 1))
                      rm -rf "${PREFLIGHT_PREFIX}"
                      if npm install -g --no-fund --no-audit --prefix "${PREFLIGHT_PREFIX}" \
                          "@napuketto/cli@${NAPUKETTO_VERSION}" > "${log}" 2>&1; then
                          rm -rf "${PREFLIGHT_PREFIX}"
                          echo "第 ${attempt} 次尝试：@napuketto/cli@${NAPUKETTO_VERSION} 及其依赖闭包安装成功，registry 已就绪，开始构建"
                          break
                      fi
                      echo "第 ${attempt} 次尝试失败，npm 摘要："
                      grep -E '^npm (error|ERR)' "${log}" | head -n 4 || true
                      if [ "$(date +%s)" -ge "${deadline}" ]; then
                          echo "::error::5 小时内仍装不上 @napuketto/cli@${NAPUKETTO_VERSION}——publish 多半卡在 environment 审批或已失败，也可能 registry 传播异常；发布成功后手动 workflow_dispatch 本 workflow 补建镜像"
                          exit 1
                      fi
                      sleep 30
                  done

            - name: Set up Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: 登录 GHCR
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 生成镜像标签（默认，含 ffmpeg）
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ steps.ver.outputs.image }}
                  tags: |
                      type=raw,value=latest
                      type=raw,value=cli-${{ steps.ver.outputs.version }}
                      type=sha,format=short,prefix=sha-

            - name: 构建并推送（默认，含 ffmpeg）
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: docker
                  file: docker/Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      NAPUKETTO_VERSION=${{ steps.ver.outputs.version }}
                      WITH_FFMPEG=true
                  provenance: true
                  sbom: true
                  cache-from: type=gha,scope=napukettoqq
                  cache-to: type=gha,scope=napukettoqq,mode=max

            - name: 生成镜像标签（slim，无 ffmpeg）
              id: meta-slim
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ steps.ver.outputs.image }}
                  flavor: |
                      suffix=-slim
                  tags: |
                      type=raw,value=latest
                      type=raw,value=cli-${{ steps.ver.outputs.version }}
                      type=sha,format=short,prefix=sha-

            - name: 构建并推送（slim，无 ffmpeg）
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: docker
                  file: docker/Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta-slim.outputs.tags }}
                  labels: ${{ steps.meta-slim.outputs.labels }}
                  build-args: |
                      NAPUKETTO_VERSION=${{ steps.ver.outputs.version }}
                      WITH_FFMPEG=false
                  provenance: true
                  sbom: true
                  # 只读 full 导出到同一 scope 的缓存；slim 自身没有新层，不需要再写一份
                  cache-from: type=gha,scope=napukettoqq
