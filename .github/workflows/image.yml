# 官方镜像构建流水线
#
# 触发：CLI 的发布 tag（release.yml 在 prepare 阶段推 `@napuketto/cli@<版本>`）或手动触发。
# 用 tag 而不是 workflow_run：release.yml 的 publish 需要 environment 审批，workflow_run
# 要等审批完成才拿到 completed 事件；tag 在 prepare 阶段就推送，镜像构建与 npm 发布并行。
#
# 并行的代价（2026-11-14 两次 ETARGET，run 43574438141 / 43577318303）：构建可能先于
# npm publish 执行——publish 卡在 environment 审批，registry 还没有该版本，npm install
# 层直接 ETARGET。故构建前先轮询 registry 等 `@napuketto/cli@<版本>` 就绪（上限 40
# 分钟，覆盖正常审批延迟；cli 在发布批里拓扑序靠后，它在 = 其 @napuketto 依赖都在）。
# publish 失败或审批迟迟不来 → 超时失败，审批发布完成后手动 workflow_dispatch 补建。
#
# 只构建 linux/amd64：arm64 的 stub / 清单条目尚未交付（见
# docs/architecture/linux-native-host.md 附录 E.2），不发布未验证的平台。
#
# 镜像内容只由已发布的 npm 包决定（Dockerfile 里 `npm install -g @napuketto/cli@<版本>`），
# 不 COPY 工作树源码——因此 tag 指向的源码被改动也不会把未发布代码带进镜像。
#
# 一次构建产出两个变体（同一 Dockerfile，只差 WITH_FFMPEG）：
#   - 默认：带静态 ffmpeg/ffprobe，语音/视频开箱即用；标签 latest / cli-<版本> / sha-<sha>
#   - slim：不带 ffmpeg（纯文本 Bot）；标签 latest-slim / cli-<版本>-slim / sha-<sha>-slim
# 两个变体在同一个 job 里顺序构建，slim 直接吃 full 刚导出的 GHA 缓存（只重跑最后
# 一个条件层），额外耗时几秒；顺序执行也避免两个 job 并发写同一个缓存 scope。
#
# 首次发布后 GHCR 包默认 private，需要在包设置里手动改为 public（或用带凭据的拉取）。

name: Image

on:
    push:
        tags:
            - "@napuketto/cli@*"
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: image-${{ github.ref }}
    cancel-in-progress: true

jobs:
    image:
        name: build & push (linux/amd64)
        runs-on: ubuntu-24.04
        # 45 分钟等包 + 两个变体构建（冷缓存约 10 分钟）
        timeout-minutes: 60
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: 解析版本与镜像名
              id: ver
              run: |
                  if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
                      version="$(jq -r .version apps/cli/package.json)"
                  else
                      version="${GITHUB_REF_NAME##*@}"
                  fi
                  echo "version=${version}" >> "${GITHUB_OUTPUT}"
                  echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/napukettoqq" >> "${GITHUB_OUTPUT}"

            # tag 在 prepare 阶段推送，npm publish 还要等 environment 审批——不 等
            # 就构建，npm install 层必然 ETARGET（2026-11-14 两次事故）。带 cachebust
            # 查询参数绕开 CDN 对 404 的短缓存；cli 版本级端点 200 = 已发布。
            - name: 等待 npm 包就绪（publish 等 environment 审批中）
              timeout-minutes: 45
              env:
                  NAPUKETTO_VERSION: ${{ steps.ver.outputs.version }}
              run: |
                  url="https://registry.npmjs.org/@napuketto%2Fcli/${NAPUKETTO_VERSION}"
                  deadline=$(( $(date +%s) + 40 * 60 ))
                  while ! curl -fsS --max-time 20 "${url}?cb=$(date +%s)" > /dev/null 2>&1; do
                      if [ "$(date +%s)" -ge "${deadline}" ]; then
                          echo "::error::等了 40 分钟 npm 仍没有 @napuketto/cli@${NAPUKETTO_VERSION}——publish 多半卡在 environment 审批或已失败；审批通过发布成功后手动 workflow_dispatch 本 workflow 补建镜像"
                          exit 1
                      fi
                      echo "npm 尚无 @napuketto/cli@${NAPUKETTO_VERSION}（publish 等审批/发布中），30 秒后重试"
                      sleep 30
                  done
                  echo "@napuketto/cli@${NAPUKETTO_VERSION} 已在 npm 上，开始构建"

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            - name: 登录 GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 生成镜像标签（默认，含 ffmpeg）
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ steps.ver.outputs.image }}
                  tags: |
                      type=raw,value=latest
                      type=raw,value=cli-${{ steps.ver.outputs.version }}
                      type=sha,format=short,prefix=sha-

            - name: 构建并推送（默认，含 ffmpeg）
              uses: docker/build-push-action@v6
              with:
                  context: docker
                  file: docker/Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      NAPUKETTO_VERSION=${{ steps.ver.outputs.version }}
                      WITH_FFMPEG=true
                  provenance: true
                  sbom: true
                  cache-from: type=gha,scope=napukettoqq
                  cache-to: type=gha,scope=napukettoqq,mode=max

            - name: 生成镜像标签（slim，无 ffmpeg）
              id: meta-slim
              uses: docker/metadata-action@v5
              with:
                  images: ${{ steps.ver.outputs.image }}
                  flavor: |
                      suffix=-slim
                  tags: |
                      type=raw,value=latest
                      type=raw,value=cli-${{ steps.ver.outputs.version }}
                      type=sha,format=short,prefix=sha-

            - name: 构建并推送（slim，无 ffmpeg）
              uses: docker/build-push-action@v6
              with:
                  context: docker
                  file: docker/Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta-slim.outputs.tags }}
                  labels: ${{ steps.meta-slim.outputs.labels }}
                  build-args: |
                      NAPUKETTO_VERSION=${{ steps.ver.outputs.version }}
                      WITH_FFMPEG=false
                  provenance: true
                  sbom: true
                  # 只读 full 导出到同一 scope 的缓存；slim 自身没有新层，不需要再写一份
                  cache-from: type=gha,scope=napukettoqq
