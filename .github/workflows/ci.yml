# CI 门禁流水线
#
# 三个并行 job：
# - gate   主门禁（ubuntu）：pnpm install → pnpm -r build → pnpm check →
#          test（附 lcov 覆盖率产出，经 codecov-action 上传，驱动 Codecov 在
#            PR 上的覆盖率评论与 status check；未配 CODECOV_TOKEN secret 时
#            公开仓自动降级 tokenless 上传，fork PR 出不了评论属预期）
#          （build 必须前置于 check：tsc 按 NodeNext 解析 workspace 包经
#            package.json exports 读到 dist 里的类型声明，全新环境无 dist 时
#            tsc 直接 TS2307，本地因 dist 常在而感知不到该顺序依赖）
#          （build 必须前置于 test：tooling/package-exports.test.ts 断言
#            dist 里的类型声明文件，干净环境无 dist 时必挂）
# - windows 跨平台测试补位：运行时目标是 Windows 优先（QQ 原生）+ Linux（wine），
#            测试套件按跨平台设计（纯函数 + mock fixture + skipIf 平台守卫），
#            与 gate 同一套用例再验一个 OS。只跑测试，不重复 check 与覆盖率。
# - audit  fallow 增量门禁：fallow audit --base 只报本次改动引入的死代码 /
#            复杂度 / 重复，存量问题自动基线豁免（gate excluded ... inherited）。
#            不用整仓 dead-code 门禁：本仓跨包消费走 workspace 链接 → dist
#            产物（NodeNext），fallow 静态图跨不过包边界，整仓模式报 82+ 误报
#            （kernel Api 方法实际被 adapter 消费），上门禁须大面积豁免失去意义
#            （2026-09-15 实测）。fallow 版本随 lockfile（devDeps +
#            --frozen-lockfile），门禁口径不随上游漂移。
#          base 解析：PR → origin/目标分支；push → 前一提交；新分支首推 /
#            workflow_dispatch 回退 HEAD~1。强推后 github.event.before 指向
#            孤儿提交（fetch 不可达），用 git cat-file 探活后同样回退 HEAD~1。
#
# 子模块策略（checkout 默认不检子模块）：
#   packages/loader/native —— 私有仓（闭源 stub），构建（tsdown 只编译 src）与
#     测试（全 mock/fixture，不碰真实 wrapper.node）均不需要，不检（GITHUB_TOKEN
#     也无权访问该仓）。
#   koishi 适配器已独立成仓（2026-10-18），不在本仓 workspace / CI 内，另有自己的
#   workflow：NapukettoDev/koishi-plugin-adapter-napuketto。
#
# pnpm 版本与根 package.json 的 packageManager 字段保持同步；显式写 `version`
# 是为了让流水线不依赖 package.json 的解析结果。不要改用 devEngines.packageManager
# 声明版本：npm ≥ 11.5 会在任何命令前校验它，而 OIDC 发布只能用 npm，等于把整仓
# 的 npm 命令（npm view / npm trust / npm publish）全部变成 EBADDEVENGINES 退出。
#
# runs-on 固定 ubuntu-24.04（不用 ubuntu-latest）：ubuntu-latest 2026-10-19 起
# 迁移到 Ubuntu 26，固定版本避免迁移窗口内环境漂移；等 26 稳定后再显式升。
# setup-node / pnpm/action-setup 升到 node24 运行时版本，消 runner 的
# 「Node.js 20 is deprecated」注解。
#
# 触发面（2026-10-21 起）：merge_group 不可省。主分支 ruleset「保护主分支」
# 启用了 merge queue，且 gate / windows / audit 是必需状态检查。GitHub 对必需
# 检查只认「在队列建的 gh-readonly-queue/<base>/pr-* 临时 ref 上跑出来的」那
# 一次，pull_request 那次不算数：缺 merge_group 时队列永远等不到检查上报，
# 超时（该 ruleset 的 check_response_timeout_minutes）后把 PR 从队列里剔除，
# 等于合并必然失败。
#
# 三个 job 的 name 就是 ruleset 里的必需检查 context，**改名必须同步改规则集**
# （gh api repos/NapukettoDev/NapukettoQQ/rulesets/24073406），否则 PR 永远等
# 不到同名检查。

name: CI

on:
    push:
        branches: [main]
    pull_request:
    merge_group:
    workflow_dispatch:

# 同一分支 / PR 的旧跑自动取消，不占额度
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    gate:
        name: gate (build / check / test / coverage)
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Checkout（不检 native 子模块）
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 12.4.1

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: 安装依赖（frozen-lockfile 锁死供应链）
              run: pnpm install --frozen-lockfile

            - name: 全量构建（check 与 test 的前置，见文件头注释）
              run: pnpm -r build

            - name: biome check + tsc --noEmit
              run: pnpm check

            - name: test（含 lcov 覆盖率产出）
              run: pnpm test --coverage

            - name: 上传覆盖率到 Codecov
              uses: codecov/codecov-action@v7
              with:
                  files: coverage/lcov.info
                  token: ${{ secrets.CODECOV_TOKEN }}

    windows:
        name: windows (test)
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - name: Checkout（不检 native 子模块）
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 12.4.1

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: 安装依赖（frozen-lockfile 锁死供应链）
              run: pnpm install --frozen-lockfile

            - name: 全量构建（package-exports 守卫消费 dist 产物）
              run: pnpm -r build

            - name: vitest 全量单测
              run: pnpm test

    audit:
        name: audit (fallow 增量门禁)
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            # fallow audit 需要读取 base 提交做 diff，必须全量历史
            - name: Checkout（全量历史；不检 native 子模块）
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 12.4.1

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: 安装依赖（fallow 来自 devDeps，版本随 lockfile）
              run: pnpm install --frozen-lockfile

            - name: 计算 audit 基线（PR → 目标分支；push → 前一提交；不可达 → HEAD~1）
              run: |
                  if [ -n "$BASE_REF" ]; then
                      echo "FALLOW_BASE=origin/$BASE_REF" >> "$GITHUB_ENV"
                  elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                      echo "FALLOW_BASE=$BEFORE" >> "$GITHUB_ENV"
                  else
                      echo "FALLOW_BASE=HEAD~1" >> "$GITHUB_ENV"
                  fi
              env:
                  BASE_REF: ${{ github.base_ref }}
                  BEFORE: ${{ github.event.before }}

            - name: fallow audit（只报改动引入的问题，存量自动基线豁免）
              run: pnpm exec fallow audit --base "$FALLOW_BASE"
