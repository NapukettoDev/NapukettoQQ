# Linux 原生宿主 smoke（nightly + 手动）
#
# 目的：在公开仓（检不到私有 packages/loader/native 子模块）验证「用户装到的发布形态」
# 能加载官方 Linux QQ 的 ELF wrapper.node。消费 npm 上已发布的 @napuketto/loader
# tarball（files 自 0.6.x 起含 native/build/linux-x64，包里自带 stub 与 assets/7zip/7zz），
# 不依赖源码构建。
#
# 覆盖：打包回归（Linux stub 必须在 tarball 里）→ 官方 deb 下载 + sha256 →
# 7zz 三层解包 → LD_PRELOAD(stub + libgnutls) 真 dlopen → 导出面断言（≥100 +
# NodeIQQNTWrapperEngine）。细节见 tooling/linux-native-smoke/README.md。
#
# 为什么不放进 CI 门禁（ci.yml）：
#   - 单次要下 ~190MB deb，不适合每个 PR 都跑；
#   - 依赖 npm 上已发布的版本，发布滞后于 PR，PR 上必然先红。
# 触发面：每夜 03:17 UTC + workflow_dispatch（可指定 loader 版本复核历史版本）。
#
# 失败排查顺序：① tarball 里有没有 stub（打包）② deb sha256（清单）③ dlopen
# （stub/gnutls/GLIBC）。全部有 [smoke] 前缀的可读提示。

name: Linux native smoke

on:
    schedule:
        - cron: "17 3 * * *"
    workflow_dispatch:
        inputs:
            loader_version:
                description: "@napuketto/loader 版本（缺省 latest）"
                required: false
                default: latest
                type: string

permissions:
    contents: read

concurrency:
    group: linux-native-smoke
    cancel-in-progress: false

jobs:
    smoke:
        name: linux-native smoke (published loader + official deb)
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        steps:
            - name: Checkout（不检 native 子模块）
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            # libgnutls30t64 是 libbugly 的隐藏依赖（无 DT_NEEDED，必须 preload）；
            # 7zz 用 loader 包内资产，不额外装 p7zip。
            - name: 系统依赖
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libgnutls30t64

            - name: 跑 smoke（发布包 stub + 官方 deb + dlopen）
              env:
                  LOADER_VERSION: ${{ inputs.loader_version || 'latest' }}
              run: node tooling/linux-native-smoke/smoke.mjs

            - name: 失败时打印环境信息
              if: failure()
              run: |
                  node --version
                  npm --version
                  ldconfig -p | grep -E 'gnutls|libuuid' || true
                  uname -a
