packages:
  - "packages/*"
  - "apps/*"
# typescript-eslint 与 TS7 原生编译器不兼容（TS7 无 JS API，parser 入口有
# versionMajor >= 7 硬 guard）。理想方案是把 @typescript-eslint/* 的 typescript
# peer 重定向到 TS6 桥接包 @typescript/typescript6，与项目的 typescript@7.0.2
# 并存（tsc --noEmit 仍走 TS7 原生）。见
# https://github.com/typescript-eslint/typescript-eslint/issues/10940
# ⚠️ 现状（2026-08-23 实测）：pnpm overrides 的 `foo>bar` 语法不覆盖
# peerDependencies（仅常规依赖），此 override 实际未生效——eslint 加载
# @typescript-eslint/parser 时仍解析到 TS7 触发 guard。保留通配符写法：
# pnpm 一旦支持 peer 覆盖立即生效；在此之前 eslint 对 .vue 的 lint 不可用
#（mjs 时代同样如此，非本次 TS 化引入）。
overrides:
  '@typescript-eslint/*>typescript': 'npm:@typescript/typescript6@6.0.2'
# pnpm 11 构建脚本审批：允许这些依赖运行 postinstall（esbuild/parcel 需要）
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true
# pnpm 11 supply-chain 校验（lockfile verify pass）跳过开关：本仓库 lockfile
# 由自己维护（自产自销 monorepo），视为可信基础。
# 背景：pnpm 11.6.0 的 verify pass 不读取 pnpm-workspace.yaml 的
# minimumReleaseAgeExclude（疑似 bug，环境变量/CLI 才生效），导致 release 流程
# 嵌套 install 时刚发布的 @napuketto/* 包（< 默认 1440 分钟发布龄）被拦截，
# 报 ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION。trustLockfile: true 直接跳过该校验。
trustLockfile: true
minimumReleaseAgeExclude:
  - '@napuketto/kernel@0.0.3'
  - '@napuketto/kernel@0.0.4'
  - '@napuketto/loader@0.0.6'
  - '@napuketto/loader@0.0.7'
  - '@napuketto/kernel@0.0.6'
  - '@napuketto/loader@0.0.8'
  - '@napuketto/kernel@0.0.7'
  - '@napuketto/loader@0.0.9'
  - '@napuketto/kernel@0.0.8'
  - '@napuketto/loader@0.0.10'
  - '@napuketto/loader@0.0.11'
  - '@napuketto/kernel@0.0.10'
  - '@napuketto/loader@0.0.12'
  - '@napuketto/loader@0.0.13'
  - '@napuketto/loader@0.0.14'
# verify-deps-before-run 预检：每次命令前自动 reinstall。发布链自己显式跑
# `pnpm install --lockfile-only`，这里关掉以免命令间隐式重装干扰；日常也可按需手动
# pnpm install（开发工作流不受影响）。
# ⚠️ 必须写在顶层：pnpm-workspace.yaml 没有 `settings` 这个键（文档里的
# “Settings” 是章节标题）。pnpm 11 会静默忽略未知键，pnpm 12 起不仅忽略不了，
# 在项目 pin 的 pnpm 版本被满足时还会直接报 ERR_PNPM_UNRECOGNIZED_WORKSPACE_SETTINGS。
verifyDepsBeforeRun: false
