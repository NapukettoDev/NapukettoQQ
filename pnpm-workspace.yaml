packages:
  - "packages/*"
  - "apps/*"

# 统一版本目录（catalog，2026-11-03 依赖审计整改）：同名依赖在全仓只能有一个
# specifier。子包一律写 `"zod": "catalog:"`，升版本只改这一处，物理上没法再
# 出现 vitest 4/5、@types/node 24/26 这类分裂。@types/node 与运行时对齐到 24
# （CI 的 node-version 口径），不再用 26。
catalog:
  zod: ^4.6.7
  hono: ^4.13.16
  "@hono/node-server": ^2.1.6
  ws: ^8.22.1
  "@types/ws": ^8.18.2
  "@types/node": ^24.13.4
  tsdown: ^0.23.4
  vitest: ^5.0.5
  "@vitest/coverage-v8": ^5.0.5

overrides:
  # @changesets/cli@3.0.2 传递的 launch-editor@2.14.1 带 1 high + 2 moderate
  # 公告；2.14.2 已修，specifier `^2.14.1` 本身允许，这里显式钉住避免漂移。
  launch-editor: ^2.14.2
  # @types/ws 声明的是 `@types/node: "*"`，pnpm 会各自解析到当时最新的 26.x，
  # 导致仓库里同时存在 24（运行时口径）与 26 两套 Node 类型。
  # 钉死到与运行时一致的 24，顺带合并 undici-types。
  "@types/node": ^24.13.4

# pnpm 构建脚本审批：允许这些依赖运行 postinstall（esbuild / parcel 需要）。
# vue-demi 自 vite 5 起不再需要构建脚本，条目已失效（2026-11-03 审计）。
allowBuilds:
  "@parcel/watcher": true
  esbuild: true

# 刚发布的自家包不受 24h 冷却期约束。用通配符消灭「每发一版加一条」的手工债
# （旧写法列了 14 条具体版本，永远不清）。
minimumReleaseAgeExclude:
  - "@napuketto/*"
